name: gym-database
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://gym_user:gym_password@db:5432/gym
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
volumes:
  postgres_data:
